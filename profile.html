<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PROFILE｜剎那 SETSUNA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #0d0f14;
      color: #f5f5f5;
    }

    header {
      border-bottom: 1px solid #242833;
      background: #0d0f14;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #c8ccd5;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: #ff7aa8;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 80px 24px;
    }

    .page-label {
      display: inline-block;
      margin-bottom: 18px;
      color: #ff7aa8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .profile-card {
      overflow: hidden;
      background: #151820;
      border: 1px solid #242936;
      border-radius: 22px;
    }

    /* PROFILE HERO */
    .profile-hero {
      padding: 56px 48px;
    }

    .profile-label {
      margin: 0 0 18px;
      color: #ff7aa8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .profile-hero h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 88px);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .profile-hero h1 span {
      color: #ff7aa8;
      font-size: inherit;
    }

    .profile-intro {
      margin: 24px 0 0;
      max-width: 680px;
      color: #c5cad3;
      font-size: 17px;
      line-height: 1.9;
    }

    @media (max-width: 760px) {
      .nav {
        align-items: flex-start;
        gap: 18px;
      }

      .nav-links {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      main {
        padding: 50px 20px;
      }

      .profile-hero {
        padding: 40px 28px;
      }

      .profile-intro {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <div class="logo">
        TW <span>VTuber Music</span>
      </div>

      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="profile.html" class="active">PROFILE</a>
        <a href="index.html#songs">MUSIC</a>
        <a href="index.html#streams">STREAMS</a>
        <a href="index.html">MILESTONES</a>
        <a href="index.html">MERCH</a>
        <a href="index.html#about">ABOUT</a>
      </nav>

    </div>
  </header>

  <main>

    <span class="page-label">VTUBER PROFILE</span>

    <div class="profile-card">

      <section class="profile-hero">

        <p class="profile-label">PROFILE</p>

        <h1>
          剎那 <span>SETSUNA</span>
        </h1>

        <p class="profile-intro">
          魂を歌声に乗せる Vsinger。<br>
          七號空間站的站長，以吉他自彈自唱與音樂活動為主。
        </p>

      </section>

    </div>

  </main>

</body>

</html>
